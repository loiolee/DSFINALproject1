server:
  port: 8081

spring:
  application:
    name: survey-system
  data:
    mongodb:
      # 默认连接本机未启用认证的 MongoDB，克隆后可直接启动。
      # 若数据库启用了认证，用环境变量覆盖，例如：
      #   MONGODB_URI="mongodb://<应用账号>:<密码>@localhost:27017/survey_db?authSource=survey_db"
      uri: ${MONGODB_URI:mongodb://localhost:27017/survey_db?maxPoolSize=50}
      auto-index-creation: true

app:
  cors:
    allowed-origins: ${SURVEY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    # 演示默认值仅用于本地开发；部署时务必通过环境变量提供高强度随机密钥。
    token-secret: ${SURVEY_TOKEN_SECRET:local-dev-token-secret-change-before-deployment-2026}
    token-ttl-seconds: 86400
    hmac-secret: ${SURVEY_HMAC_SECRET:local-dev-hmac-secret-change-before-deployment-2026}

logging:
  level:
    com.example.surveysystem: INFO
