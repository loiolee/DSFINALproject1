<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" role="img">
  <title>第二阶段需求实现状态</title>
  <desc>8条新需求在数据模型、后端接口、前端页面三个层面的实现状态</desc>
  <style>
    .t { font-family: sans-serif; font-size: 12px; fill: #2C2C2A; }
    .th { font-family: sans-serif; font-size: 12px; fill: #2C2C2A; font-weight: 500; }
    .ok { fill: #3B6D11; }
    .cell { stroke-width: 0.5; stroke: #B4B2A9; }
    .head { fill: #F1EFE8; }
    .done { fill: #EAF3DE; }
  </style>

  <!-- 表头 -->
  <rect x="40" y="20" width="50" height="36" class="cell head" rx="4"/>
  <text x="65" y="38" text-anchor="middle" class="th" dominant-baseline="central">编号</text>
  <rect x="90" y="20" width="240" height="36" class="cell head" rx="4"/>
  <text x="210" y="38" text-anchor="middle" class="th" dominant-baseline="central">需求</text>
  <rect x="330" y="20" width="110" height="36" class="cell head" rx="4"/>
  <text x="385" y="38" text-anchor="middle" class="th" dominant-baseline="central">数据模型</text>
  <rect x="440" y="20" width="110" height="36" class="cell head" rx="4"/>
  <text x="495" y="38" text-anchor="middle" class="th" dominant-baseline="central">后端接口</text>
  <rect x="550" y="20" width="110" height="36" class="cell head" rx="4"/>
  <text x="605" y="38" text-anchor="middle" class="th" dominant-baseline="central">前端页面</text>

  <!-- 数据行 -->
  <g id="row1">
    <rect x="40" y="56" width="50" height="32" class="cell" fill="#fff"/><text x="65" y="72" text-anchor="middle" class="t" dominant-baseline="central">N-01</text>
    <rect x="90" y="56" width="240" height="32" class="cell" fill="#fff"/><text x="100" y="72" class="t" dominant-baseline="central">保存常用题目到个人题库</text>
    <rect x="330" y="56" width="110" height="32" class="cell done"/><text x="385" y="72" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="440" y="56" width="110" height="32" class="cell done"/><text x="495" y="72" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="550" y="56" width="110" height="32" class="cell done"/><text x="605" y="72" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
  </g>
  <g id="row2">
    <rect x="40" y="88" width="50" height="32" class="cell" fill="#fff"/><text x="65" y="104" text-anchor="middle" class="t" dominant-baseline="central">N-02</text>
    <rect x="90" y="88" width="240" height="32" class="cell" fill="#fff"/><text x="100" y="104" class="t" dominant-baseline="central">把题目共享给别人（use/edit）</text>
    <rect x="330" y="88" width="110" height="32" class="cell done"/><text x="385" y="104" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="440" y="88" width="110" height="32" class="cell done"/><text x="495" y="104" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="550" y="88" width="110" height="32" class="cell done"/><text x="605" y="104" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
  </g>
  <g id="row3">
    <rect x="40" y="120" width="50" height="32" class="cell" fill="#fff"/><text x="65" y="136" text-anchor="middle" class="t" dominant-baseline="central">N-03</text>
    <rect x="90" y="120" width="240" height="32" class="cell" fill="#fff"/><text x="100" y="136" class="t" dominant-baseline="central">改题不影响已发布/已填写的问卷</text>
    <rect x="330" y="120" width="110" height="32" class="cell done"/><text x="385" y="136" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="440" y="120" width="110" height="32" class="cell done"/><text x="495" y="136" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="550" y="120" width="110" height="32" class="cell done"/><text x="605" y="136" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
  </g>
  <g id="row4">
    <rect x="40" y="152" width="50" height="32" class="cell" fill="#fff"/><text x="65" y="168" text-anchor="middle" class="t" dominant-baseline="central">N-04</text>
    <rect x="90" y="152" width="240" height="32" class="cell" fill="#fff"/><text x="100" y="168" class="t" dominant-baseline="central">记录题目修改历史</text>
    <rect x="330" y="152" width="110" height="32" class="cell done"/><text x="385" y="168" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="440" y="152" width="110" height="32" class="cell done"/><text x="495" y="168" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="550" y="152" width="110" height="32" class="cell done"/><text x="605" y="168" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
  </g>
  <g id="row5">
    <rect x="40" y="184" width="50" height="32" class="cell" fill="#fff"/><text x="65" y="200" text-anchor="middle" class="t" dominant-baseline="central">N-05</text>
    <rect x="90" y="184" width="240" height="32" class="cell" fill="#fff"/><text x="100" y="200" class="t" dominant-baseline="central">同题多版本共存</text>
    <rect x="330" y="184" width="110" height="32" class="cell done"/><text x="385" y="200" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="440" y="184" width="110" height="32" class="cell done"/><text x="495" y="200" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="550" y="184" width="110" height="32" class="cell done"/><text x="605" y="200" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
  </g>
  <g id="row6">
    <rect x="40" y="216" width="50" height="32" class="cell" fill="#fff"/><text x="65" y="232" text-anchor="middle" class="t" dominant-baseline="central">N-06</text>
    <rect x="90" y="216" width="240" height="32" class="cell" fill="#fff"/><text x="100" y="232" class="t" dominant-baseline="central">查某题被哪些问卷使用</text>
    <rect x="330" y="216" width="110" height="32" class="cell done"/><text x="385" y="232" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="440" y="216" width="110" height="32" class="cell done"/><text x="495" y="232" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="550" y="216" width="110" height="32" class="cell done"/><text x="605" y="232" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
  </g>
  <g id="row7">
    <rect x="40" y="248" width="50" height="32" class="cell" fill="#fff"/><text x="65" y="264" text-anchor="middle" class="t" dominant-baseline="central">N-07</text>
    <rect x="90" y="248" width="240" height="32" class="cell" fill="#fff"/><text x="100" y="264" class="t" dominant-baseline="central">建立题目库</text>
    <rect x="330" y="248" width="110" height="32" class="cell done"/><text x="385" y="264" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="440" y="248" width="110" height="32" class="cell done"/><text x="495" y="264" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="550" y="248" width="110" height="32" class="cell done"/><text x="605" y="264" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
  </g>
  <g id="row8">
    <rect x="40" y="280" width="50" height="32" class="cell" fill="#fff"/><text x="65" y="296" text-anchor="middle" class="t" dominant-baseline="central">N-08</text>
    <rect x="90" y="280" width="240" height="32" class="cell" fill="#fff"/><text x="100" y="296" class="t" dominant-baseline="central">查看单题跨问卷统计（按版本分组）</text>
    <rect x="330" y="280" width="110" height="32" class="cell done"/><text x="385" y="296" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="440" y="280" width="110" height="32" class="cell done"/><text x="495" y="296" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
    <rect x="550" y="280" width="110" height="32" class="cell done"/><text x="605" y="296" text-anchor="middle" class="t ok" dominant-baseline="central">✓</text>
  </g>
</svg>